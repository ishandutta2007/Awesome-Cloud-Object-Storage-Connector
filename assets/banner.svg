<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d192e" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <style>
      .node-pulse {
        animation: pulseAnim 3s ease-in-out infinite alternate;
      }
      .node-pulse-delayed {
        animation: pulseAnim 3s ease-in-out infinite alternate;
        animation-delay: 1.5s;
      }
      .data-flow-1 {
        stroke-dasharray: 8 16;
        animation: flowDash 12s linear infinite;
      }
      .data-flow-2 {
        stroke-dasharray: 6 14;
        animation: flowDashRev 14s linear infinite;
      }
      .badge-hover {
        transition: transform 0.3s ease;
      }
      .badge-hover:hover {
        transform: translateY(-2px);
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowDashRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 240; }
      }
      @keyframes pulseAnim {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes floatOrb {
        0% { transform: translate(0px, 0px); }
        50% { transform: translate(15px, -10px); }
        100% { transform: translate(0px, 0px); }
      }
      .floating-orb {
        animation: floatOrb 8s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Background Ambient Glowing Orbs -->
  <circle cx="150" cy="100" r="140" fill="url(#glowGrad1)" class="floating-orb" />
  <circle cx="1060" cy="320" r="160" fill="url(#glowGrad2)" class="floating-orb" style="animation-delay: -4s;" />
  <circle cx="950" cy="80" r="90" fill="url(#glowGrad1)" class="floating-orb" style="animation-delay: -2s;" />

  <!-- Animated Data Connection Lines (Behind Text & Foreground Elements) -->
  <g opacity="0.6">
    <path d="M 80,330 C 300,310 450,380 750,340 C 950,310 1080,360 1140,330" fill="none" stroke="#0ea5e9" stroke-width="2" class="data-flow-1" />
    <path d="M 60,360 C 260,390 520,330 800,370 C 1000,400 1100,320 1150,300" fill="none" stroke="#6366f1" stroke-width="1.8" class="data-flow-2" />
    <path d="M 120,60 C 350,90 600,40 900,70 C 1020,90 1100,60 1160,50" fill="none" stroke="#38bdf8" stroke-width="1.5" class="data-flow-1" opacity="0.4" />
  </g>

  <!-- Dynamic Network Gateway Nodes (Floating subtle icons in corners) -->
  <g opacity="0.75">
    <!-- Left Decorative Storage Node -->
    <g transform="translate(70, 180)" class="node-pulse">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="-8" y1="2" x2="8" y2="2" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="5" cy="8" r="1.5" fill="#38bdf8" />
    </g>

    <!-- Right Decorative Cloud Gateway Node -->
    <g transform="translate(1120, 180)" class="node-pulse-delayed">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
      <!-- Cloud Outline -->
      <path d="M -12,4 A 6,6 0 0,1 -6,-6 A 8,8 0 0,1 8,-6 A 6,6 0 0,1 12,4 Z" fill="none" stroke="#c084fc" stroke-width="1.8" />
    </g>
  </g>

  <!-- Foreground Title and Center Content (Layered above all background anims) -->
  <g filter="url(#shadowFilter)">
    <!-- Category Badge -->
    <g transform="translate(600, 72)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="-118" cy="0" r="5" fill="#38bdf8" />
      <text x="-104" y="5" fill="#bae6fd" font-size="12" class="tagline-text" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM GUIDE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" class="title-text" font-size="46" fill="url(#titleGrad)">Awesome Cloud Object Storage Connectors</text>

    <!-- Divider Line -->
    <path d="M 420,165 L 780,165" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Subtitle -->
    <text x="600" y="200" text-anchor="middle" class="subtitle-text" font-size="18" fill="#94a3b8">
      S3-Compatible APIs &bull; Storage Gateways &bull; Multi-Cloud Sync &bull; FUSE Drivers &bull; Egress Optimization
    </text>

    <!-- Feature Highlights / Interactive Badges -->
    <g transform="translate(600, 260)">
      <!-- Pill 1: S3 API Compatibility -->
      <g transform="translate(-360, 0)" class="badge-hover">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
        <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-size="13" class="tagline-text" font-weight="600">⚡ S3 Universal API</text>
      </g>

      <!-- Pill 2: Zero Egress Focus -->
      <g transform="translate(-180, 0)" class="badge-hover">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
        <text x="0" y="5" text-anchor="middle" fill="#34d399" font-size="13" class="tagline-text" font-weight="600">💸 Zero Egress R2/B2</text>
      </g>

      <!-- Pill 3: FUSE & Filesystem Gateways -->
      <g transform="translate(0, 0)" class="badge-hover">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
        <text x="0" y="5" text-anchor="middle" fill="#818cf8" font-size="13" class="tagline-text" font-weight="600">📂 FUSE &amp; Gateways</text>
      </g>

      <!-- Pill 4: Open Source Stacks -->
      <g transform="translate(180, 0)" class="badge-hover">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#9333ea" stroke-width="1.5" />
        <text x="0" y="5" text-anchor="middle" fill="#c084fc" font-size="13" class="tagline-text" font-weight="600">⭐ Top Open-Source</text>
      </g>

      <!-- Pill 5: Multi-Cloud Replication -->
      <g transform="translate(360, 0)" class="badge-hover">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#ea580c" stroke-width="1.5" />
        <text x="0" y="5" text-anchor="middle" fill="#fb923c" font-size="13" class="tagline-text" font-weight="600">🔄 Cross-Cloud Sync</text>
      </g>
    </g>

    <!-- Bottom Metadata Bar -->
    <g transform="translate(600, 345)">
      <text x="0" y="0" text-anchor="middle" font-size="13" fill="#64748b" class="subtitle-text">
        AWS S3 &bull; Azure Blob &bull; Google Cloud &bull; Cloudflare R2 &bull; Wasabi &bull; Backblaze &bull; MinIO &bull; Rclone &bull; JuiceFS &bull; Ceph
      </text>
      <text x="0" y="22" text-anchor="middle" font-size="12" fill="#475569" class="subtitle-text">
        Updated March 2026 &bull; Curated for Developers, Cloud Architects &amp; DevOps Engineers
      </text>
    </g>
  </g>
</svg>
